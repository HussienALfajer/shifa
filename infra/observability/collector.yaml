# OpenTelemetry Collector for the local stack (spec 0.2-09b, PLT-52 scrubbing layer two).
# The API already exports only allowlisted data (apps/api/src/telemetry/scrub.ts). This file
# catches a mistake there before anything is stored: it deletes the denied keys again and keeps
# only allowlisted keys, then forwards to otel-lgtm on the compose network.
# Changing an allowlist? Read docs/process/observability.md ("Adding an attribute") first.

receivers:
  otlp:
    protocols:
      # Inside the container; the host reaches them only through 127.0.0.1 (compose.yml).
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Denied keys (spec criterion 6). Same list for resources (resource/deny) and for span, log
  # record and metric data point attributes (attributes/deny). Patterns are RE2.
  resource/deny:
    attributes: &deny
      - { action: delete, pattern: ^http\.(request|response)\.body(\..*)?$ }
      - { action: delete, key: url.query }
      - { action: delete, key: url.full }
      - { action: delete, key: url.path }
      - { action: delete, key: http.url }
      - { action: delete, key: http.target }
      - { action: delete, key: http.client_ip }
      - { action: delete, key: net.peer.ip }
      - { action: delete, key: net.sock.peer.addr }
      - { action: delete, key: client.address }
      - { action: delete, key: client.port }
      - { action: delete, key: network.peer.address }
      - { action: delete, key: db.query.text }
      - { action: delete, key: db.statement }
      - { action: delete, pattern: ^db\.query\.parameter\..* }
      - { action: delete, key: exception.message }
      - { action: delete, pattern: ^enduser\..* }
      # Every header except the request content-type (RE2 has no negative look-ahead): keep a
      # copy, delete all headers, restore the copy. The API exports user-agent as
      # user_agent.original, never as a header attribute.
      - {
          action: insert,
          key: shifa.keep.content_type,
          from_attribute: http.request.header.content-type,
        }
      - { action: delete, pattern: ^http\.(request|response)\.header\..* }
      - {
          action: insert,
          key: http.request.header.content-type,
          from_attribute: shifa.keep.content_type,
        }
      - { action: delete, key: shifa.keep.content_type }
  attributes/deny:
    actions: *deny

  # Allowlist again: any key not listed is removed (resource, span, log and data point
  # attributes), and allowed values that look like an e-mail address, a bearer token or a JWT
  # are masked. Must hold every key of scrub.ts (obs-collector-config.test.mjs checks it).
  redaction:
    allow_all_keys: false
    summary: silent
    allowed_keys:
      # Resource (ALLOWED_RESOURCE_ATTRIBUTES)
      - service.name
      - service.version
      - deployment.environment
      - telemetry.sdk.name
      - telemetry.sdk.language
      - telemetry.sdk.version
      # Spans (ALLOWED_SPAN_ATTRIBUTES)
      - http.route
      - http.request.method
      - http.method
      - http.response.status_code
      - http.status_code
      - http.response.status_class
      - http.flavor
      - network.protocol.version
      - network.protocol.name
      - url.scheme
      - http.scheme
      - user_agent.original
      - http.user_agent
      - http.request.header.content-type
      - error.type
      - shifa.request_id
      - tenant.id
      - user.id
      - db.system
      - db.system.name
      - db.operation.name
      - db.operation
      - db.collection.name
      - db.sql.table
      # Metric labels (ALLOWED_METRIC_LABELS, besides the request labels above)
      - nodejs.eventloop.state
      - v8js.heap.space.name
      - v8js.gc.type
      # Log records: the pino fields the API writes (Fastify's request lines, the error filter,
      # the access guard, validation and shutdown).
      - reqId
      - requestId
      - req
      - res
      - responseTime
      - err
      - route
      - handler
      - status
      - issues
      - signal
    blocked_values:
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
      - '(?i)bearer\s+[A-Za-z0-9._~+/=-]+'
      - 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*'

  batch:
    timeout: 1s

exporters:
  otlp_grpc/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/deny, attributes/deny, redaction, batch]
      exporters: [otlp_grpc/lgtm]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/deny, attributes/deny, redaction, batch]
      exporters: [otlp_grpc/lgtm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/deny, attributes/deny, redaction, batch]
      exporters: [otlp_grpc/lgtm]
