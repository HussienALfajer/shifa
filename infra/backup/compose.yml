# Local backup stack (spec 0.2-09c, ADR-0029): PostgreSQL 18 archiving WAL with pgBackRest into
# an encrypted repository on a single-node Garage, behind Caddy's TLS. Development and CI only:
# synthetic data, PostgreSQL is the only published port and it is bound to 127.0.0.1.
# Start it with `pnpm backup:up`, which writes the secrets this file references into ./.env
# (git-ignored) on first run. Images are pinned by version and digest; update both together
# (docs/process/backup-restore.md).
name: shifa-backup

x-pgbackrest-env: &pgbackrest-env
  PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_KEY_ID:?run pnpm backup:up}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:?run pnpm backup:up}
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?run pnpm backup:up}

services:
  postgres:
    build:
      context: ./postgres
    image: shifa/backup-postgres:18.6-2.60.0
    environment:
      <<: *pgbackrest-env
      POSTGRES_PASSWORD: ${BACKUP_POSTGRES_PASSWORD:?run pnpm backup:up}
    # WAL archiving (criterion 2): every segment goes to the repository through pgBackRest, and
    # a segment is switched at least every 60 s under low traffic (RPO <= 5 min, ADR-0029).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=shifa archive-push %p
      - -c
      - archive_timeout=60s
    volumes:
      - pgdata:/var/lib/postgresql
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./.state:/etc/pgbackrest/ca:ro
    ports:
      - 127.0.0.1:55432:5432
    depends_on:
      garage-tls:
        condition: service_healthy
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    environment:
      GARAGE_RPC_SECRET: ${BACKUP_GARAGE_RPC_SECRET:?run pnpm backup:up}
      GARAGE_ADMIN_TOKEN: ${BACKUP_GARAGE_ADMIN_TOKEN:?run pnpm backup:up}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, status]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  garage-tls:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: [CMD, test, -s, /data/caddy/pki/authorities/local/root.crt]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

volumes:
  pgdata:
  garage-meta:
  garage-data:
  caddy-data:
