# pgBackRest configuration for the local backup stack (spec 0.2-09c, ADR-0029). Secrets never
# live here: pgBackRest reads them from the container environment, which compose fills from
# infra/backup/.env (git-ignored):
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS
# Retention and the schedule mirror infra/backup/schedule.json (a script test keeps them equal).

[global]
# Repository 1: Garage (S3 API) behind Caddy's TLS. pgBackRest's S3 driver speaks HTTPS only;
# certificate verification stays on, against the stack's own CA.
repo1-type=s3
repo1-s3-endpoint=garage-tls
repo1-s3-bucket=shifa-backup
repo1-s3-region=garage
repo1-s3-uri-style=path
repo1-storage-ca-file=/etc/pgbackrest/ca/ca.crt
repo1-path=/shifa
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30

# Repository 2: the off-site copy at a second provider, blocked by OD-01 (hosting). Same
# options with the repo2- prefix and its own key and passphrase, e.g.:
# repo2-type=s3
# repo2-s3-endpoint=<off-site endpoint>
# repo2-s3-bucket=<bucket>
# repo2-s3-region=<region>
# repo2-cipher-type=aes-256-cbc
# repo2-retention-full-type=time
# repo2-retention-full=30

compress-type=zst
start-fast=y
log-level-console=info
log-level-file=info

[shifa]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=postgres
