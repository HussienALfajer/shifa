# Single-node Garage for the local backup stack (spec 0.2-09c, ADR-0021). rpc_secret and
# admin_token are not here: Garage reads GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN from the
# container environment, which compose fills from infra/backup/.env (git-ignored).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
