<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الهادئ — حجز المريض</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html{background:#d9d5cb}
#dc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:#1d2a26;color:#e6ede9;font:14px/1.6 'Shifa Sans Arabic',system-ui,sans-serif}
#dc-bar strong{font-weight:600}
#dc-bar a{color:#a9cfc3;text-decoration:none;padding:4px 6px;border-radius:4px}
#dc-bar a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.12)}
#dc-bar button{font:inherit;color:#1d2a26;background:#e6ede9;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
#dc-bar a:focus-visible,#dc-bar button:focus-visible{outline:2px solid #d4b463;outline-offset:2px}
#dc-bar .dc-push{margin-inline-start:auto}
#dc-root.dc-fixed{display:flex;justify-content:center;padding:24px 0}

body{margin:0}
a{color:#1f6f5c}a:hover{color:#134a3d}
.sh{--app:#fbf8f1;--surface:#ffffff;--raised:#f4efe3;--border:#e6dfcf;--strong:#76857e;--text:#1d2a26;--muted:#5b6a63;--primary:#1f6f5c;--primary-h:#134a3d;--on-primary:#ffffff;--soft:#e2f0ea;--accent:#c8a24a;--green-f:#1d744c;--green-b:#edf8f3;--gap:20px;
font-family:'Shifa Sans Arabic',system-ui,sans-serif;color:var(--text);background:var(--app);font-variant-numeric:tabular-nums}
.sh[data-theme="dark"]{--app:#0e1513;--surface:#151e1b;--raised:#1c2824;--border:#2b3934;--text:#e6ede9;--muted:#a3b2ab;--primary:#6fc3ab;--primary-h:#9ad8c5;--on-primary:#0e1513;--soft:#12382f;--accent:#d4b463;--green-f:#42bb82;--green-b:#162c22}
.sh[data-density="compact"]{--gap:14px}
.sh button{font:inherit;cursor:pointer;transition:background-color 100ms ease-out,color 100ms ease-out,border-color 100ms ease-out}
.sh button:focus-visible,.sh a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sh .btn-p:hover{background:var(--primary-h)}
.sh .btn-p:disabled{background:var(--raised);color:var(--muted);cursor:default}
.sh .chip{height:48px;border-radius:6px;border:1px solid var(--strong);background:var(--surface);color:var(--text);font-size:16px;font-weight:500}
.sh .chip:hover{background:var(--raised)}
.sh .chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sh .chip:disabled{border-color:var(--border);background:transparent;color:var(--muted);text-decoration:line-through;cursor:default}
.sh .day{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;height:64px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:13px;line-height:20px}
.sh .day.on{background:var(--soft);color:var(--primary)}
.sh .lbl{font-size:13px;line-height:20px;font-weight:500;color:var(--muted)}
.step{animation:fade 200ms ease-out}
@keyframes fade{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sh *{transition:none!important}.step{animation:none}}
</style>
</head>
<body>
<nav id="dc-bar" aria-label="شاشات الاتجاه">
<strong>B · الهادئ</strong>
<a href="reception-queue.html">دور الاستقبال</a><a href="doctor-visit.html">زيارة الطبيب</a><a href="doctor-visit-tablet.html">الزيارة على اللوحي</a><a href="patient-booking.html" aria-current="page">حجز المريض</a>
<button type="button" class="dc-push" data-dc-set="theme light dark">فاتح / داكن</button>
<button type="button" data-dc-set="density comfortable compact">مريح / مضغوط</button>
</nav>
<div id="dc-root" class="dc-fixed"><div class="sh" data-theme="light" data-density="comfortable" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; font-size: 16px; line-height: 24px">

        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 14px; line-height: 22px; color: var(--muted); text-align: center">الخميس 20 تشرين الثاني · الساعة 11:30</span>
          <button class="btn-p" type="button" data-dc-on="click:9" style="height: 52px; border: 0; border-radius: 6px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 600">تأكيد الحجز</button>
        </div>
      </main>
    </div>
  

  
</div></div>
<script type="application/json" id="dc-template">"\u003cdiv class=\"sh\" data-theme=\"{{theme}}\" data-density=\"{{density}}\" style=\"width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; font-size: 16px; line-height: 24px\">\n\n  \u003cheader style=\"padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 2px\">\n    \u003cspan style=\"font-size: 19px; font-weight: 600; line-height: 30px\">عيادة الياسمين\u003c/span>\n    \u003cspan style=\"font-size: 14px; line-height: 22px; color: var(--muted)\">[عنوان العيادة]\u003c/span>\n  \u003c/header>\n\n  \u003csc-if value=\"{{isTime}}\" hint-placeholder-val=\"{{true}}\">\n    \u003cdiv class=\"step\" style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n      \u003col aria-label=\"خطوات الحجز\" style=\"list-style: none; margin: 0; padding: 0 20px 16px; display: flex; gap: 8px; font-size: 13px; line-height: 20px; color: var(--muted)\">\n        \u003cli>الطبيب\u003c/li>\u003cli aria-hidden=\"true\">·\u003c/li>\n        \u003cli>اليوم\u003c/li>\u003cli aria-hidden=\"true\">·\u003c/li>\n        \u003cli aria-current=\"step\" style=\"color: var(--primary); font-weight: 600\">الوقت\u003c/li>\u003cli aria-hidden=\"true\">·\u003c/li>\n        \u003cli>التأكيد\u003c/li>\n      \u003c/ol>\n\n      \u003cmain style=\"flex: 1; min-height: 0; background: var(--surface); border-radius: 12px 12px 0 0; padding: 20px; display: flex; flex-direction: column; gap: var(--gap)\">\n        \u003cdiv style=\"display: flex; align-items: center; gap: 12px\">\n          \u003cspan aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--soft); color: var(--primary)\">\n            \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 4a3.5 3.5 0 1 0 0 7a3.5 3.5 0 0 0 0-7zM5 20c0-3.5 3-6 7-6s7 2.5 7 6\"/>\u003c/svg>\n          \u003c/span>\n          \u003cdiv style=\"display: flex; flex-direction: column; margin-inline-end: auto\">\n            \u003cspan style=\"font-weight: 600\">د. \u003cspan data-person=\"سامر الخطيب\">سامر الخطيب\u003c/span>\u003c/span>\n            \u003cspan style=\"font-size: 14px; line-height: 22px; color: var(--muted)\">الأجرة: [الأجرة]\u003c/span>\n          \u003c/div>\n          \u003ca href=\"#b-day\" style=\"font-size: 14px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center\">تغيير\u003c/a>\n        \u003c/div>\n\n        \u003cdiv id=\"b-day\" style=\"display: flex; flex-direction: column; gap: 8px\">\n          \u003cspan class=\"lbl\">اليوم\u003c/span>\n          \u003cdiv style=\"display: flex; gap: 4px; justify-content: space-between\">\n            \u003cbutton class=\"day on\" type=\"button\" aria-pressed=\"true\">\u003cspan>الخميس\u003c/span>\u003cspan style=\"font-size: 19px; font-weight: 600; line-height: 26px\">\u003cbdi dir=\"ltr\">20\u003c/bdi>\u003c/span>\u003c/button>\n            \u003cbutton class=\"day\" type=\"button\" aria-pressed=\"false\">\u003cspan>السبت\u003c/span>\u003cspan style=\"font-size: 19px; font-weight: 500; line-height: 26px; color: var(--text)\">\u003cbdi dir=\"ltr\">22\u003c/bdi>\u003c/span>\u003c/button>\n            \u003cbutton class=\"day\" type=\"button\" aria-pressed=\"false\">\u003cspan>الأحد\u003c/span>\u003cspan style=\"font-size: 19px; font-weight: 500; line-height: 26px; color: var(--text)\">\u003cbdi dir=\"ltr\">23\u003c/bdi>\u003c/span>\u003c/button>\n            \u003cbutton class=\"day\" type=\"button\" aria-pressed=\"false\">\u003cspan>الاثنين\u003c/span>\u003cspan style=\"font-size: 19px; font-weight: 500; line-height: 26px; color: var(--text)\">\u003cbdi dir=\"ltr\">24\u003c/bdi>\u003c/span>\u003c/button>\n            \u003cbutton class=\"day\" type=\"button\" aria-pressed=\"false\">\u003cspan>الثلاثاء\u003c/span>\u003cspan style=\"font-size: 19px; font-weight: 500; line-height: 26px; color: var(--text)\">\u003cbdi dir=\"ltr\">25\u003c/bdi>\u003c/span>\u003c/button>\n          \u003c/div>\n        \u003c/div>\n\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\n          \u003cspan class=\"lbl\">اختر الوقت\u003c/span>\n          \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n            \u003csc-for list=\"{{times}}\" as=\"t\" hint-placeholder-count=\"9\">\n              \u003cbutton class=\"{{t.cls}}\" type=\"button\" onClick=\"{{t.pick}}\" disabled=\"{{t.taken}}\" aria-pressed=\"{{t.on}}\">\u003cbdi dir=\"ltr\">{{t.label}}\u003c/bdi>\u003c/button>\n            \u003c/sc-for>\n          \u003c/div>\n          \u003cspan style=\"font-size: 13px; line-height: 20px; color: var(--muted)\">الأوقات المشطوبة محجوزة.\u003c/span>\n        \u003c/div>\n\n        \u003cdiv style=\"margin-top: auto; display: flex; flex-direction: column; gap: 10px\">\n          \u003cspan style=\"font-size: 14px; line-height: 22px; color: var(--muted); text-align: center\">{{summary}}\u003c/span>\n          \u003cbutton class=\"btn-p\" type=\"button\" onClick=\"{{confirm}}\" disabled=\"{{noPick}}\" style=\"height: 52px; border: 0; border-radius: 6px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 600\">تأكيد الحجز\u003c/button>\n        \u003c/div>\n      \u003c/main>\n    \u003c/div>\n  \u003c/sc-if>\n\n  \u003csc-if value=\"{{isDone}}\" hint-placeholder-val=\"{{false}}\">\n    \u003cmain class=\"step\" style=\"flex: 1; min-height: 0; background: var(--surface); border-radius: 12px 12px 0 0; padding: 32px 20px 20px; display: flex; flex-direction: column; align-items: stretch; gap: 20px\">\n      \u003cdiv style=\"display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center\">\n        \u003cspan style=\"display: inline-flex; align-items: center; gap: 8px; height: 32px; padding-inline: 12px; border-radius: 999px; background: var(--green-b); color: var(--green-f); font-size: 14px; font-weight: 600\">\n          \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/>\u003c/svg>\n          تم الحجز\n        \u003c/span>\n        \u003ch1 style=\"margin: 0; font-size: 23px; font-weight: 600; line-height: 34px\">موعدك مؤكَّد يا \u003cspan data-person=\"سارة إبراهيم الأحمد\">سارة إبراهيم الأحمد\u003c/span>\u003c/h1>\n      \u003c/div>\n\n      \u003cdiv style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 24px; border-radius: 12px; background: var(--soft)\">\n        \u003cspan style=\"font-size: 14px; line-height: 22px; color: var(--primary); font-weight: 500\">رقم دورك\u003c/span>\n        \u003cspan style=\"font-size: 64px; font-weight: 500; line-height: 1.1; color: var(--primary)\">\u003cbdi dir=\"ltr\">12\u003c/bdi>\u003c/span>\n      \u003c/div>\n\n      \u003cdl style=\"margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 15px; line-height: 24px\">\n        \u003cdt style=\"color: var(--muted)\">الطبيب\u003c/dt>\u003cdd style=\"margin: 0; font-weight: 500\">د. \u003cspan data-person=\"سامر الخطيب\">سامر الخطيب\u003c/span>\u003c/dd>\n        \u003cdt style=\"color: var(--muted)\">الموعد\u003c/dt>\u003cdd style=\"margin: 0; font-weight: 500\">الخميس \u003cbdi dir=\"ltr\">20\u003c/bdi> تشرين الثاني · \u003cbdi dir=\"ltr\">{{picked}}\u003c/bdi>\u003c/dd>\n        \u003cdt style=\"color: var(--muted)\">العيادة\u003c/dt>\u003cdd style=\"margin: 0; font-weight: 500\">عيادة الياسمين · [عنوان العيادة]\u003c/dd>\n        \u003cdt style=\"color: var(--muted)\">الأجرة\u003c/dt>\u003cdd style=\"margin: 0; font-weight: 500\">[الأجرة]\u003c/dd>\n      \u003c/dl>\n\n      \u003cdiv style=\"margin-top: auto; display: flex; flex-direction: column; gap: 8px\">\n        \u003cspan style=\"font-size: 14px; line-height: 22px; color: var(--muted); text-align: center\">سنذكّرك قبل الموعد برسالة.\u003c/span>\n        \u003cbutton type=\"button\" onClick=\"{{back}}\" style=\"height: 48px; border: 1px solid var(--strong); border-radius: 6px; background: transparent; color: var(--primary); font-size: 16px; font-weight: 500\">تغيير الوقت\u003c/button>\n      \u003c/div>\n    \u003c/main>\n  \u003c/sc-if>\n\u003c/div>"</script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: '11:30', step: 'time' };
  }
  renderVals() {
    const { picked, step } = this.state;
    const slots = ['10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '16:00', '16:30', '17:00'];
    const taken = ['10:30', '12:00', '16:30'];
    const times = slots.map((label) => {
      const on = label === picked;
      return {
        label,
        on,
        taken: taken.includes(label),
        cls: on ? 'chip on' : 'chip',
        pick: () => this.setState({ picked: label }),
      };
    });
    return {
      theme: this.props.theme ?? 'light',
      density: this.props.density ?? 'comfortable',
      times,
      picked: picked ?? '',
      noPick: !picked,
      summary: picked ? `الخميس 20 تشرين الثاني · الساعة ${picked}` : 'اختر وقتاً للمتابعة',
      isTime: step === 'time',
      isDone: step === 'done',
      confirm: () => this.setState({ step: 'done' }),
      back: () => this.setState({ step: 'time' }),
    };
  }
}
DC.mount(Component);
</script>
