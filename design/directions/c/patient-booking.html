html{background:#d9d5cb}

#dc-bar strong{font-weight:600}
#dc-bar a{color:#a9cfc3;text-decoration:none;padding:4px 6px;border-radius:4px}
#dc-bar a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.12)}
#dc-bar button{font:inherit;color:#1d2a26;background:#e6ede9;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
#dc-bar a:focus-visible,#dc-bar button:focus-visible{outline:2px solid #d4b463;outline-offset:2px}
#dc-bar .dc-push{margin-inline-start:auto}
#dc-root.dc-fixed{display:flex;justify-content:center;padding:24px 0}

body{margin:0}
a{color:#1f6f5c}a:hover{color:#134a3d}
.sh{--app:#fbf8f1;--surface:#ffffff;--raised:#f4efe3;--border:#e6dfcf;--strong:#76857e;--text:#1d2a26;--muted:#5b6a63;--primary:#1f6f5c;--primary-h:#134a3d;--on-primary:#ffffff;--soft:#e2f0ea;--duo:#cfe6dc;--accent:#c8a24a;--accent-soft:#f7edd3;--shadow:0 1px 2px rgba(29,42,38,.09);--green-f:#1d744c;--green-b:#edf8f3;
font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--text);background:var(--app);font-variant-numeric:tabular-nums}
.sh[data-theme="dark"]{--app:#0e1513;--surface:#151e1b;--raised:#1c2824;--border:#2b3934;--text:#e6ede9;--muted:#a3b2ab;--primary:#6fc3ab;--primary-h:#9ad8c5;--on-primary:#0e1513;--soft:#12382f;--duo:#1d4a3f;--accent:#d4b463;--accent-soft:#3a2f14;--shadow:none;--green-f:#42bb82;--green-b:#162c22}
.sh button{font:inherit;cursor:pointer;transition:background-color 150ms ease-out,border-color 150ms ease-out,color 150ms ease-out}
.sh button:focus-visible,.sh a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sh .btn-p:hover{background:var(--primary-h)}
.sh .btn-p:disabled{background:var(--raised);color:var(--muted);cursor:default}
.sh .btn-s:hover{background:var(--soft)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;padding:6px 8px;border:1px solid var(--strong);border-radius:12px;background:var(--surface);color:var(--text);font-size:18px;font-weight:600;line-height:26px}
.chip:hover{background:var(--soft)}
.chip.sel{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.sel .sub{color:var(--on-primary)}
.chip .sub{font-size:14px;font-weight:400;line-height:20px;color:var(--muted)}
.chip:disabled{background:var(--raised);border-color:var(--border);color:var(--muted);cursor:default;text-decoration:line-through}
.rise{animation:rise 240ms ease-out}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sh *{transition:none!important}.rise{animation:none}}
</style>

    const DAYS = [['الخميس', 20], ['السبت', 22], ['الأحد', 23], ['الاثنين', 24]];
    const TIMES = ['10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '16:00', '16:30', '17:00'];
    const TAKEN = [[0, 1, 5], [3], [0, 6, 7], [2]];
    const { day, time, done } = this.state;
    const taken = TAKEN[day];
    const dayText = `${DAYS[day][0]} ${DAYS[day][1]} تشرين الثاني`;
    return {
      theme: this.props.theme ?? 'light',
      density: this.props.density ?? 'comfortable',
      picking: !done,
      done,
      noTime: time === null,
      days: DAYS.map((d, i) => ({
        name: d[0],
        num: d[1],
        sel: i === day,
        cls: `chip${i === day ? ' sel' : ''}`,
        pick: () => this.setState({ day: i, time: null }),
      })),
      times: TIMES.map((t, i) => ({
        label: t,
        taken: taken.includes(i),
        sel: i === time,
        cls: `chip${i === time ? ' sel' : ''}`,
        pick: () => this.setState({ time: i }),
      })),
      summary: time === null ? `${dayText} · اختاري الوقت المناسب` : `${dayText} · الساعة ${TIMES[time]}`,
      when: time === null ? dayText : `${dayText} · الساعة ${TIMES[time]}`,
      confirm: () => this.setState({ done: true }),
      again: () => this.setState({ done: false }),
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
