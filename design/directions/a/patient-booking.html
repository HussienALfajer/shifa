<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدقيق — حجز المريض</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html{background:#d9d5cb}
#dc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:#1d2a26;color:#e6ede9;font:14px/1.6 'Shifa Sans Arabic',system-ui,sans-serif}
#dc-bar strong{font-weight:600}
#dc-bar a{color:#a9cfc3;text-decoration:none;padding:4px 6px;border-radius:4px}
#dc-bar a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.12)}
#dc-bar button{font:inherit;color:#1d2a26;background:#e6ede9;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
#dc-bar a:focus-visible,#dc-bar button:focus-visible{outline:2px solid #d4b463;outline-offset:2px}
#dc-bar .dc-push{margin-inline-start:auto}
#dc-root.dc-fixed{display:flex;justify-content:center;padding:24px 0}

body{margin:0}
a{color:#1f6f5c}a:hover{color:#134a3d}
.sh{--app:#fbf8f1;--surface:#ffffff;--raised:#f4efe3;--border:#e6dfcf;--strong:#76857e;--text:#1d2a26;--muted:#5b6a63;--primary:#1f6f5c;--primary-h:#134a3d;--on-primary:#ffffff;--soft:#e2f0ea;--accent:#c8a24a;--nav:#134a3d;--nav-text:#e8f2ee;--nav-dim:#a9cfc3;--slot:48px;--gap:16px;
--green-f:#1d744c;--green-b:#edf8f3;--slate-f:#58676f;--slate-b:#f1f3f3;
font-family:'Shifa Sans Arabic',system-ui,sans-serif;color:var(--text);background:var(--app);font-variant-numeric:tabular-nums}
.sh[data-theme="dark"]{--app:#0e1513;--surface:#151e1b;--raised:#1c2824;--border:#2b3934;--text:#e6ede9;--muted:#a3b2ab;--primary:#6fc3ab;--primary-h:#9ad8c5;--on-primary:#0e1513;--soft:#12382f;--accent:#d4b463;--nav:#0c2a23;--nav-dim:#8fb5aa;
--green-f:#42bb82;--green-b:#162c22;--slate-f:#95a1a7;--slate-b:#1f2223}
.sh[data-density="compact"]{--slot:44px;--gap:12px}
.sh button{font:inherit;cursor:pointer;transition:background-color 70ms linear,border-color 70ms linear,color 70ms linear}
.sh button:focus-visible,.sh a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sh .btn-p:hover{background:var(--primary-h)}
.sh .btn-p:disabled{opacity:.5;cursor:default}
.sh .btn-s:hover{background:var(--soft)}
.slot{height:var(--slot);border:1px solid var(--strong);border-radius:4px;background:var(--surface);color:var(--text);font-size:17px;font-weight:500}
.slot:hover{background:var(--soft)}
.slot.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.slot.off{background:var(--raised);border-color:var(--border);color:var(--muted);text-decoration:line-through;cursor:default}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:44px;border-bottom:1px solid var(--border);font-size:16px;line-height:24px}
.kv:last-child{border-bottom:0}
.kv>span{display:flex;align-items:center;padding:8px 12px}
.kv>span:first-child{color:var(--muted);font-size:14px;border-inline-end:1px solid var(--border)}
.step{flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:18px;color:var(--muted)}
.step i{display:block;height:3px;background:var(--border)}
.step.done i{background:var(--primary)}
.step.now{color:var(--text);font-weight:600}
.step.now i{background:var(--accent)}
.view{animation:view 150ms ease-out}
@keyframes view{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sh *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav id="dc-bar" aria-label="شاشات الاتجاه">
<strong>A · الدقيق</strong>
<a href="reception-queue.html">دور الاستقبال</a><a href="doctor-visit.html">زيارة الطبيب</a><a href="doctor-visit-tablet.html">الزيارة على اللوحي</a><a href="patient-booking.html" aria-current="page">حجز المريض</a>
<button type="button" class="dc-push" data-dc-set="theme light dark">فاتح / داكن</button>
<button type="button" data-dc-set="density comfortable compact">مريح / مضغوط</button>
</nav>
<div id="dc-root" class="dc-fixed"><div class="sh" data-theme="light" data-density="comfortable" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-size: 16px; line-height: 24px">

  <header style="flex: none; background: var(--nav); color: var(--nav-text); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 13px; line-height: 18px; color: var(--nav-dim)">حجز موعد · شفاء</span>
    <span style="font-size: 20px; font-weight: 600; line-height: 28px">عيادة الياسمين</span>
    <span style="font-size: 14px; line-height: 20px; color: var(--nav-dim)">[عنوان العيادة]</span>
  </header>

  
    <div class="view" style="flex: 1; min-height: 0; display: flex; flex-direction: column">
      <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: var(--gap)">

        <ol aria-label="خطوات الحجز" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 6px">
          <li class="step done"><i></i>الطبيب</li>
          <li class="step done"><i></i>اليوم</li>
          <li class="step now" aria-current="step"><i></i>الوقت</li>
          <li class="step"><i></i>التأكيد</li>
        </ol>

        <section aria-label="ملخص الحجز" style="background: var(--surface); border: 1px solid var(--strong); border-radius: 4px">
          <div class="kv"><span>الطبيب</span><span style="font-weight: 600">د.&nbsp;<span data-person="سامر الخطيب">سامر الخطيب</span></span></div>
          <div class="kv"><span>اليوم</span><span>الخميس <bdi dir="ltr">20</bdi> تشرين الثاني</span></div>
          <div class="kv"><span>الأجرة</span><span>[الأجرة]</span></div>
        </section>

        <section aria-label="اختيار الوقت" style="display: flex; flex-direction: column; gap: 10px">
          <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 28px">اختر الوقت</h1>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            
              <button class="slot" type="button" aria-pressed="false" data-dc-on="click:0"><bdi dir="ltr">10:00</bdi></button>
            
              <button class="slot" type="button" aria-pressed="false" data-dc-on="click:1"><bdi dir="ltr">10:20</bdi></button>
            
              <button class="slot off" type="button" aria-pressed="false" disabled data-dc-on="click:2"><bdi dir="ltr">10:40</bdi></button>
            
              <button class="slot" type="button" aria-pressed="false" data-dc-on="click:3"><bdi dir="ltr">11:00</bdi></button>
            
              <button class="slot" type="button" aria-pressed="false" data-dc-on="click:4"><bdi dir="ltr">11:20</bdi></button>
            
              <button class="slot" type="button" aria-pressed="false" data-dc-on="click:5"><bdi dir="ltr">11:40</bdi></button>
            
              <button class="slot off" type="button" aria-pressed="false" disabled data-dc-on="click:6"><bdi dir="ltr">12:00</bdi></button>
            
              <button class="slot" type="button" aria-pressed="false" data-dc-on="click:7"><bdi dir="ltr">12:20</bdi></button>
            
              <button class="slot" type="button" aria-pressed="false" data-dc-on="click:8"><bdi dir="ltr">12:40</bdi></button>
            
          </div>
          <span style="font-size: 14px; line-height: 20px; color: var(--muted)">الأوقات المشطوبة محجوزة.</span>
        </section>
      </div>

      <footer style="flex: none; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--strong); display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; line-height: 20px; color: var(--muted)">اختر وقتاً للمتابعة.</span>
        <button class="btn-p" type="button" data-dc-on="click:9" disabled style="height: 48px; border: 1px solid var(--primary); border-radius: 4px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 600">تأكيد الحجز</button>
      </footer>
    </div>
  

  
</div></div>
<script type="application/json" id="dc-template">"\u003cdiv class=\"sh\" data-theme=\"{{theme}}\" data-density=\"{{density}}\" style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-size: 16px; line-height: 24px\">\n\n  \u003cheader style=\"flex: none; background: var(--nav); color: var(--nav-text); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 2px\">\n    \u003cspan style=\"font-size: 13px; line-height: 18px; color: var(--nav-dim)\">حجز موعد · شفاء\u003c/span>\n    \u003cspan style=\"font-size: 20px; font-weight: 600; line-height: 28px\">عيادة الياسمين\u003c/span>\n    \u003cspan style=\"font-size: 14px; line-height: 20px; color: var(--nav-dim)\">[عنوان العيادة]\u003c/span>\n  \u003c/header>\n\n  \u003csc-if value=\"{{picking}}\" hint-placeholder-val=\"{{true}}\">\n    \u003cdiv class=\"view\" style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n      \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: var(--gap)\">\n\n        \u003col aria-label=\"خطوات الحجز\" style=\"list-style: none; margin: 0; padding: 0; display: flex; gap: 6px\">\n          \u003cli class=\"step done\">\u003ci>\u003c/i>الطبيب\u003c/li>\n          \u003cli class=\"step done\">\u003ci>\u003c/i>اليوم\u003c/li>\n          \u003cli class=\"step now\" aria-current=\"step\">\u003ci>\u003c/i>الوقت\u003c/li>\n          \u003cli class=\"step\">\u003ci>\u003c/i>التأكيد\u003c/li>\n        \u003c/ol>\n\n        \u003csection aria-label=\"ملخص الحجز\" style=\"background: var(--surface); border: 1px solid var(--strong); border-radius: 4px\">\n          \u003cdiv class=\"kv\">\u003cspan>الطبيب\u003c/span>\u003cspan style=\"font-weight: 600\">د.&nbsp;\u003cspan data-person=\"سامر الخطيب\">سامر الخطيب\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>اليوم\u003c/span>\u003cspan>الخميس \u003cbdi dir=\"ltr\">20\u003c/bdi> تشرين الثاني\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>الأجرة\u003c/span>\u003cspan>[الأجرة]\u003c/span>\u003c/div>\n        \u003c/section>\n\n        \u003csection aria-label=\"اختيار الوقت\" style=\"display: flex; flex-direction: column; gap: 10px\">\n          \u003ch1 style=\"margin: 0; font-size: 20px; font-weight: 600; line-height: 28px\">اختر الوقت\u003c/h1>\n          \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n            \u003csc-for list=\"{{slots}}\" as=\"slot\" hint-placeholder-count=\"9\">\n              \u003cbutton class=\"{{slot.cls}}\" type=\"button\" aria-pressed=\"{{slot.on}}\" disabled=\"{{slot.taken}}\" onClick=\"{{slot.pick}}\">\u003cbdi dir=\"ltr\">{{slot.t}}\u003c/bdi>\u003c/button>\n            \u003c/sc-for>\n          \u003c/div>\n          \u003cspan style=\"font-size: 14px; line-height: 20px; color: var(--muted)\">الأوقات المشطوبة محجوزة.\u003c/span>\n        \u003c/section>\n      \u003c/div>\n\n      \u003cfooter style=\"flex: none; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--strong); display: flex; flex-direction: column; gap: 8px\">\n        \u003cspan style=\"font-size: 14px; line-height: 20px; color: var(--muted)\">{{pickLine}}\u003c/span>\n        \u003cbutton class=\"btn-p\" type=\"button\" onClick=\"{{confirm}}\" disabled=\"{{noPick}}\" style=\"height: 48px; border: 1px solid var(--primary); border-radius: 4px; background: var(--primary); color: var(--on-primary); font-size: 17px; font-weight: 600\">تأكيد الحجز\u003c/button>\n      \u003c/footer>\n    \u003c/div>\n  \u003c/sc-if>\n\n  \u003csc-if value=\"{{confirmed}}\" hint-placeholder-val=\"{{false}}\">\n    \u003cdiv class=\"view\" style=\"flex: 1; min-height: 0; display: flex; flex-direction: column\">\n      \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: var(--gap)\">\n\n        \u003col aria-label=\"خطوات الحجز\" style=\"list-style: none; margin: 0; padding: 0; display: flex; gap: 6px\">\n          \u003cli class=\"step done\">\u003ci>\u003c/i>الطبيب\u003c/li>\n          \u003cli class=\"step done\">\u003ci>\u003c/i>اليوم\u003c/li>\n          \u003cli class=\"step done\">\u003ci>\u003c/i>الوقت\u003c/li>\n          \u003cli class=\"step now\" aria-current=\"step\">\u003ci>\u003c/i>التأكيد\u003c/li>\n        \u003c/ol>\n\n        \u003cdiv role=\"status\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--green-f); border-radius: 4px; background: var(--green-b); color: var(--green-f); font-size: 17px; font-weight: 600\">\n          \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM8.5 12.5l2.5 2.5l4.5-5\"/>\u003c/svg>\n          تم الحجز\n        \u003c/div>\n\n        \u003csection aria-label=\"رقم الدور\" style=\"display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--strong); border-radius: 4px\">\n          \u003cspan style=\"display: flex; align-items: center; justify-content: center; min-width: 76px; height: 64px; border: 1px solid var(--text); border-radius: 2px; font-size: 40px; font-weight: 600; line-height: 1\">\u003cbdi dir=\"ltr\">12\u003c/bdi>\u003c/span>\n          \u003cdiv style=\"display: flex; flex-direction: column; gap: 2px\">\n            \u003cspan style=\"font-size: 14px; line-height: 20px; color: var(--muted)\">رقم دورك\u003c/span>\n            \u003cspan style=\"font-size: 16px; line-height: 24px\">أظهره عند الاستقبال.\u003c/span>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection aria-label=\"تفاصيل الموعد\" style=\"background: var(--surface); border: 1px solid var(--strong); border-radius: 4px\">\n          \u003cdiv class=\"kv\">\u003cspan>باسم\u003c/span>\u003cspan data-person=\"سارة إبراهيم الأحمد\" style=\"font-weight: 600\">سارة إبراهيم الأحمد\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>الطبيب\u003c/span>\u003cspan>د.&nbsp;\u003cspan data-person=\"سامر الخطيب\">سامر الخطيب\u003c/span>\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>اليوم\u003c/span>\u003cspan>الخميس \u003cbdi dir=\"ltr\">20\u003c/bdi> تشرين الثاني\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>الوقت\u003c/span>\u003cspan style=\"font-weight: 600\">\u003cbdi dir=\"ltr\">{{picked}}\u003c/bdi>\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>العيادة\u003c/span>\u003cspan>عيادة الياسمين\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>العنوان\u003c/span>\u003cspan>[عنوان العيادة]\u003c/span>\u003c/div>\n          \u003cdiv class=\"kv\">\u003cspan>الأجرة\u003c/span>\u003cspan>[الأجرة]\u003c/span>\u003c/div>\n        \u003c/section>\n      \u003c/div>\n\n      \u003cfooter style=\"flex: none; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--strong)\">\n        \u003cbutton class=\"btn-s\" type=\"button\" onClick=\"{{change}}\" style=\"width: 100%; height: 48px; border: 1px solid var(--primary); border-radius: 4px; background: transparent; color: var(--primary); font-size: 17px; font-weight: 500\">تغيير الوقت\u003c/button>\n      \u003c/footer>\n    \u003c/div>\n  \u003c/sc-if>\n\u003c/div>"</script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, confirmed: false };
  }
  renderVals() {
    const taken = ['10:40', '12:00'];
    const times = ['10:00', '10:20', '10:40', '11:00', '11:20', '11:40', '12:00', '12:20', '12:40'];
    const picked = this.state.picked;
    const slots = times.map((t) => {
      const off = taken.includes(t);
      const on = t === picked;
      return {
        t,
        taken: off,
        on,
        cls: `slot${on ? ' on' : ''}${off ? ' off' : ''}`,
        pick: () => this.setState({ picked: t }),
      };
    });
    return {
      theme: this.props.theme ?? 'light',
      density: this.props.density ?? 'comfortable',
      slots,
      picked: picked ?? '',
      noPick: !picked,
      pickLine: picked ? `الخميس 20 تشرين الثاني · الساعة ${picked}` : 'اختر وقتاً للمتابعة.',
      picking: !this.state.confirmed,
      confirmed: this.state.confirmed,
      confirm: () => this.setState({ confirmed: true }),
      change: () => this.setState({ confirmed: false }),
    };
  }
}
DC.mount(Component);
</script>
</body>
