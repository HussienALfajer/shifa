<style>
html{background:#d9d5cb}
#dc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px;background:#1d2a26;color:#e6ede9;font:14px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif}
#dc-bar strong{font-weight:600}
#dc-bar a{color:#a9cfc3;text-decoration:none;padding:4px 6px;border-radius:4px}
#dc-bar a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.12)}
#dc-bar button{font:inherit;color:#1d2a26;background:#e6ede9;border:0;border-radius:4px;padding:4px 10px;cursor:pointer}
#dc-bar a:focus-visible,#dc-bar button:focus-visible{outline:2px solid #d4b463;outline-offset:2px}
#dc-bar .dc-push{margin-inline-start:auto}
#dc-root.dc-fixed{display:flex;justify-content:center;padding:24px 0}

body{margin:0}
a{color:#1f6f5c}a:hover{color:#134a3d}
.sh{--app:#fbf8f1;--surface:#ffffff;--raised:#f4efe3;--border:#e6dfcf;--strong:#76857e;--text:#1d2a26;--muted:#5b6a63;--primary:#1f6f5c;--primary-h:#134a3d;--on-primary:#ffffff;--soft:#e2f0ea;--accent:#c8a24a;--accent-soft:#f7edd3;--nav:#134a3d;--nav-text:#e8f2ee;--focal-line:#1f6f5c;--green-f:#1d744c;--green-b:#edf8f3;
font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--text);background:var(--app);font-variant-numeric:tabular-nums}
.sh[data-theme="dark"]{--app:#0e1513;--surface:#151e1b;--raised:#1c2824;--border:#2b3934;--text:#e6ede9;--muted:#a3b2ab;--primary:#6fc3ab;--primary-h:#9ad8c5;--on-primary:#0e1513;--soft:#12382f;--accent:#d4b463;--accent-soft:#3a2f14;--nav:#0c2a23;--focal-line:#d4b463;--green-f:#42bb82;--green-b:#162c22}
.sh button{font:inherit;cursor:pointer;transition:background-color 100ms ease-out,border-color 100ms ease-out,color 100ms ease-out}
.sh button:focus-visible,.sh a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.chip{height:52px;border:1px solid var(--strong);border-radius:6px;background:var(--surface);color:var(--text);font-size:18px;font-weight:500}
.chip:hover{background:var(--soft)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.chip:disabled{border-color:var(--border);background:var(--raised);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.cta{height:56px;border:0;border-radius:6px;background:var(--primary);color:var(--on-primary);font-size:18px;font-weight:600}
.cta:hover{background:var(--primary-h)}
.cta:disabled{background:var(--raised);color:var(--muted);cursor:not-allowed}
.sheet{animation:rise 220ms ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sh *{transition:none!important}.sheet{animation:none}}
</style>

tion>\n\n      \u003csection aria-label=\"اختيار الوقت\" style=\"display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0\">\n        \u003ch1 style=\"margin: 0; font-size: 19px; font-weight: 600\">اختاري الوقت المناسب\u003c/h1>\n        \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n          \u003csc-for list=\"{{slots}}\" as=\"s\" hint-placeholder-count=\"9\">\n            \u003cbutton class=\"{{s.cls}}\" type=\"button\" aria-pressed=\"{{s.on}}\" disabled=\"{{s.taken}}\" onClick=\"{{s.pick}}\">\u003cbdi dir=\"ltr\">{{s.time}}\u003c/bdi>\u003c/button>\n          \u003c/sc-for>\n        \u003c/div>\n        \u003cspan style=\"font-size: 13px; color: var(--muted)\">الأوقات المشطوبة محجوزة.\u003c/span>\n      \u003c/section>\n\n      \u003cbutton class=\"cta\" type=\"button\" disabled=\"{{noPick}}\" onClick=\"{{confirm}}\">{{ctaLabel}}\u003c/button>\n    \u003c/div>\n  \u003c/sc-if>\n\n  \u003csc-if value=\"{{done}}\" hint-placeholder-val=\"{{false}}\">\n    \u003cdiv style=\"flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 28px\">\n      \u003cdiv class=\"sheet\" role=\"status\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 32px 20px 20px; background: var(--surface); border: 1.5px solid var(--focal-line); border-bottom: 0; border-radius: 20px 20px 0 0; text-align: center\">\n        \u003cspan style=\"display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding-inline: 10px 12px; border-radius: 6px; border-inline-start: 2px solid var(--green-f); background: var(--green-b); color: var(--green-f); font-size: 15px; font-weight: 600\">\n          \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12.5l4.5 4.5L19 7.5\"/>\u003c/svg> <script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, done: false };
  }
  renderVals() {
    const { picked, done } = this.state;
    const taken = ['11:15', '12:00'];
    const times = ['10:30', '10:45', '11:00', '11:15', '11:30', '11:45', '12:00', '12:15', '12:30'];
    const slots = times.map((time) => ({
      time,
      on: time === picked,
      taken: taken.includes(time),
      cls: time === picked ? 'chip on' : 'chip',
      pick: () => this.setState({ picked: time }),
    }));
    return {
      theme: this.props.theme ?? 'light',
      slots,
      picked: picked ?? '',
      picking: !done,
      done,
      noPick: !picked,
      ctaLabel: picked ? `تأكيد الحجز · ${picked}` : 'اختاري وقتاً للمتابعة',
      confirm: () => this.setState({ done: true }),
      edit: () => this.setState({ done: false }),
    };
  }
}
DC.mount(Component);
</script>
