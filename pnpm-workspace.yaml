packages:
  - apps/*
  - packages/*
  - tooling/*
  # Throwaway spikes (0.3-S1): linted and typechecked in verify like any package. Their test
  # suites are `test:spike` scripts, run by the spike's manual workflow, not by verify (OD-31).
  - spikes/*/*

# Install scripts are denied unless listed true. These three are optional native speed-ups of
# testcontainers' Docker client (ssh2) and gRPC (protobufjs); the pure-JS fallbacks are used.
allowBuilds:
  # core-js-pure (via dcmjs, 0.3-S4) only prints a funding banner from its postinstall.
  core-js-pure: false
  cpu-features: false
  protobufjs: false
  ssh2: false

# Supply-chain guard: never install a version published less than 24 hours ago.
minimumReleaseAge: 1440
