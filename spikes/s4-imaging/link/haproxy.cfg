# Clinic → cloud forwarding through the link (TCP mode: TLS and HTTP stay end to end). No
# request log: the link sees bytes only. Server names are resolved through Docker's DNS so a
# restarted container is found again.
global
  maxconn 4096

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s

defaults
  mode tcp
  timeout connect 10s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h

# The imaging gateway (viewer, browser upload, edge push).
frontend gateway
  bind :8080
  default_backend to-gateway

backend to-gateway
  server gateway gateway:8080 resolvers docker init-addr last,libc,none

# Byte sink for the link's own tests (present only when the harness starts it).
frontend sink
  bind :9000
  default_backend to-sink

backend to-sink
  server sink sink:9000 resolvers docker init-addr last,libc,none
