# The repository's rule set (root analysis_options.yaml), for this standalone package.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  errors:
    unawaited_futures: error
    discarded_futures: error

linter:
  rules:
    discarded_futures: true
    unawaited_futures: true
    # A throwaway probe, not a published package.
    public_member_api_docs: false
    # `dart format` wraps the code; file-header comments keep the spike's 100-column style.
    lines_longer_than_80_chars: false
