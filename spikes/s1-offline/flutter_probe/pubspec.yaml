# Flutter probe of spike 0.3-S1 (slice 0.3-S1e): the patient app's offline cache, SQLCipher
# encryption and offline cancel on both engines. Standalone: not in the root pub workspace, no
# package.json (verify does not run it; the manual s1-offline workflow does). Throwaway.
name: s1_flutter_probe
description: Throwaway Flutter probe for the offline sync spike (synthetic data only).
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.13.0
  flutter: 3.47.9

dependencies:
  drift: 2.35.4
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  path: 1.9.1
  path_provider: 2.1.6
  powersync: 2.6.1
  sqlite3: 3.9.1
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 11.0.0

# One SQLite build for both engines: the SQLCipher community edition from package:sqlite3's
# build hook (sha256-checked against the published package). Every database here is keyed.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
