# PowerSync Sync Streams for spike 0.3-S1 (edition 3). Every stream is scoped by the JWT:
# tenant_id and branch_id (reception) or sub (patient), and "today" by the `day` claim. The
# replication role bypasses RLS, so these filters are the only tenant boundary on the download
# side (criterion 10; the tenant-scoping spec checks them).
config:
  edition: 3

streams:
  reception_tickets:
    auto_subscribe: true
    query: >-
      SELECT id, practitioner_id, shift_date, provisional_number, device_id, real_number, status,
             walk_in_label
        FROM s1.queue_ticket
       WHERE tenant_id = auth.parameter('tenant_id')
         AND branch_id = auth.parameter('branch_id')
         AND shift_date = auth.parameter('day')
         AND auth.parameter('role') = 'reception'

  reception_appointments:
    auto_subscribe: true
    query: >-
      SELECT id, practitioner_id, patient_id, starts_at, ends_at, status
        FROM s1.appointment
       WHERE tenant_id = auth.parameter('tenant_id')
         AND branch_id = auth.parameter('branch_id')
         AND clinic_day = auth.parameter('day')
         AND auth.parameter('role') = 'reception'

  reception_cash_sessions:
    auto_subscribe: true
    query: >-
      SELECT id, rates, closed_at
        FROM s1.cash_session
       WHERE tenant_id = auth.parameter('tenant_id')
         AND branch_id = auth.parameter('branch_id')
         AND clinic_day = auth.parameter('day')
         AND auth.parameter('role') = 'reception'

  reception_cash_movements:
    auto_subscribe: true
    query: >-
      SELECT id, session_id, type, currency, amount_minor, rate_used, offline, refund_of, device_id
        FROM s1.cash_movement
       WHERE tenant_id = auth.parameter('tenant_id')
         AND branch_id = auth.parameter('branch_id')
         AND clinic_day = auth.parameter('day')
         AND auth.parameter('role') = 'reception'

  # Results of this device's own commands (remaps, conflicts, refusals). The device id comes from
  # the token (bound at login; the server refuses commands naming another device), never from
  # a client-chosen parameter. Login lets a client name any device id, so results also match the
  # token's user: a patient naming a reception device gets nothing (0.3-S1e security review M1).
  device_results:
    auto_subscribe: true
    query: >-
      SELECT id, device_id, type, result
        FROM s1.offline_command
       WHERE tenant_id = auth.parameter('tenant_id')
         AND branch_id = auth.parameter('branch_id')
         AND device_id = auth.parameter('device_id')
         AND user_id = auth.user_id()

  # A session left open from an earlier day stays usable (the outbox pull includes it too).
  reception_open_cash_sessions:
    auto_subscribe: true
    query: >-
      SELECT id, rates, closed_at
        FROM s1.cash_session
       WHERE tenant_id = auth.parameter('tenant_id')
         AND branch_id = auth.parameter('branch_id')
         AND closed_at IS NULL
         AND auth.parameter('role') = 'reception'

  patient_appointments:
    auto_subscribe: true
    query: >-
      SELECT id, practitioner_id, patient_id, starts_at, ends_at, status
        FROM s1.appointment
       WHERE tenant_id = auth.parameter('tenant_id')
         AND patient_id = auth.user_id()
         AND auth.parameter('role') = 'patient'

  # The patient app's ticket of today (slice 0.3-S1e): only tickets issued for this patient.
  patient_tickets:
    auto_subscribe: true
    query: >-
      SELECT id, practitioner_id, shift_date, provisional_number, real_number, status, walk_in_label
        FROM s1.queue_ticket
       WHERE tenant_id = auth.parameter('tenant_id')
         AND patient_id = auth.user_id()
         AND shift_date = auth.parameter('day')
         AND auth.parameter('role') = 'patient'
