# Spike 0.3-S1: offline sync scenario suite (Playwright + Toxiproxy + Testcontainers) per engine,
# and the Flutter probe. Manual dispatch only; never part of PR CI. Kept for Phase A reuse.
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
name: s1-offline

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Sync engine to run the scenarios on
        type: choice
        options: [outbox, powersync, both]
        default: both
      flutter:
        description: Also run the Flutter probe (its job arrives with slice 0.3-S1e)
        type: boolean
        default: true

permissions: {}

jobs:
  scenarios:
    name: scenarios (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [outbox, powersync]
    steps:
      - name: Skip engines not requested
        id: pick
        env:
          WANTED: ${{ inputs.engine }}
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "$WANTED" = both ] || [ "$WANTED" = "$ENGINE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pick.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.pick.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        if: steps.pick.outputs.run == 'true'
        working-directory: spikes/s1-offline/scenarios
        run: pnpm exec playwright install --with-deps chromium
      - name: Run scenarios
        if: steps.pick.outputs.run == 'true'
        working-directory: spikes/s1-offline/scenarios
        env:
          ENGINE: ${{ matrix.engine }}
        run: pnpm scenario
      - name: Upload report and counts-only summary
        if: always() && steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s1-offline-${{ matrix.engine }}
          path: |
            spikes/s1-offline/scenarios/playwright-report
            spikes/s1-offline/scenarios/test-results/summary
          retention-days: 30
