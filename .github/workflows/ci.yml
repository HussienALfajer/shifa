# Quality gates for every pull request and every push to main.
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment); Dependabot updates them.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

# Flutter pins for the caches and dart jobs (one copy, so their cache keys cannot drift apart).
env:
  FLUTTER_VERSION: 3.47.9
  FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
  # Digest of the extracted archive (see "Install Flutter"); empty means no SDK caching.
  FLUTTER_TREE_SHA256: a281bdcde4c195d1b0f4605a147eacfd7f44ceec82ea54f91f781434c9ccab8b

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel runs on main: every merged commit must get a completed verify and secret scan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # verify runs as parallel jobs (OD-34). `checks` runs the repository-level steps (`verify docs`:
  # format, instructions, root lint, script tests, file length); `node`, `dart` and `build`
  # run `verify full --part <name>`. Together they run every step of `verify full`
  # (scripts/test/verify-parts.test.mjs and ci-verify-jobs.test.mjs check the split). On pushes
  # to main, `caches` saves the Flutter SDK and pub caches first. Pull requests that change only docs/
  # run `checks` alone; every push to main runs everything. `verify docs` still executes
  # repository code (script tests, ESLint configs), so a docs-only pull request is not "no code
  # ran" and gets the same review. No job restores a Turborepo cache: a cached task result is an
  # unverifiable "passed" that code on main could plant for a future tree (OD-34).
  scope:
    name: verify scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: the PR merge commit and its first parent (the base), to list the change.
          fetch-depth: 2
          persist-credentials: false
      - name: Choose verify mode
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mode=full
          if [ "$EVENT" = pull_request ]; then
            # --no-renames lists both sides of a move, so moving a file out of docs/ is code.
            # quotePath=false keeps non-ASCII (Arabic) names unquoted; control characters stay
            # quoted, start with `"` and so force full.
            changed="$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^docs/'; then
              mode=docs
            fi
            # Printed between stop-commands markers with a random token, so no file name can act
            # as a workflow command (`::add-mask::`, `##[...]`) in this job.
            echo 'Changed files:'
            token="$(openssl rand -hex 16)"
            echo "::stop-commands::${token}"
            printf '%s\n' "$changed"
            echo "::${token}::"
          fi
          echo "verify mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # Saves the Flutter SDK and pub caches on pushes to main, before any job of the run executes
  # repository or dependency code: every job that does (checks, node, build, dart) needs this one
  # and starts only after it has finished (OD-30). Skipped on pull requests, which only restore.
  caches:
    name: CI caches
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches (Flutter SDK, pub packages) are saved only by pushes to main, right after the
      # download is verified and before any repository dependency or test runs; pull requests
      # only restore. That alone is not enough: any job on main can create a cache key that does
      # not exist yet (for example the next Flutter version's), so a restored entry is only as
      # trustworthy as the check run on it (OD-30).
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter
          key: ci-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}
      # Flutter from Google's release storage, checksum-verified, no third-party action. The
      # version must match .fvmrc; the SHA-256 comes from Google's releases_linux.json for it.
      # The cache holds the untouched extraction, and FLUTTER_TREE_SHA256 pins a digest of that
      # tree (paths, types, modes, link targets, file contents). A restored tree that does not
      # match is discarded and reinstalled from the archive, so a planted entry costs time, never
      # integrity. On a version bump, set FLUTTER_TREE_SHA256 to the digest a run prints.
      - name: Install Flutter
        id: flutter-install
        working-directory: ${{ runner.temp }}
        env:
          CACHE_HIT: ${{ steps.flutter-cache.outputs.cache-hit }}
          FVMRC: ${{ github.workspace }}/.fvmrc
        run: |
          # System tools only: a restored cache entry could place look-alikes (sha256sum, find,
          # tar) in a directory that comes earlier on the runner's PATH (OD-35).
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          tree_digest() {
            ( cd "$1" && {
              find . -printf '%y %m %p -> %l\n' | LC_ALL=C sort
              find . -type f -print0 | xargs -0 -r -P4 -n256 sha256sum | LC_ALL=C sort -k2
            } | sha256sum | cut -d' ' -f1 )
          }
          # Only known keys: FVM honours flutterUrl/cachePath in .fvmrc, which could point
          # every developer's `fvm install` at another repository.
          jq -e 'keys - ["flutter","updateGitIgnore","updateVscodeSettings"] == []' "$FVMRC" > /dev/null \
            || { echo "::error::.fvmrc has keys other than flutter/updateGitIgnore/updateVscodeSettings"; exit 1; }
          pinned="$(jq -r .flutter "$FVMRC")"
          if [ "$pinned" != "$FLUTTER_VERSION" ]; then
            echo "::error::.fvmrc pins Flutter $pinned but CI installs $FLUTTER_VERSION; update ci.yml"
            exit 1
          fi
          sdk="${RUNNER_TEMP}/flutter"
          save=false
          # Checked whenever anything is at the path: a restore that failed half-way reports
          # no cache hit but leaves its files behind.
          if [ -e "$sdk" ]; then
            restored="$(tree_digest "$sdk")"
            if [ -n "$FLUTTER_TREE_SHA256" ] && [ "$restored" = "$FLUTTER_TREE_SHA256" ]; then
              echo "Restored Flutter SDK matches the pinned tree digest"
            else
              echo "::warning::restored Flutter SDK does not match FLUTTER_TREE_SHA256 ($restored); reinstalling from the archive"
              rm -rf "$sdk"
            fi
          fi
          if [ ! -d "$sdk" ]; then
            archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            curl -fsSL -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
            echo "${FLUTTER_SHA256}  ${archive}" | sha256sum --check --strict
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            rm "$archive"
            extracted="$(tree_digest "$sdk")"
            echo "Flutter SDK tree digest: $extracted"
            if [ -z "$FLUTTER_TREE_SHA256" ]; then
              echo "::warning::FLUTTER_TREE_SHA256 is not set; the SDK is not cached. Pin: $extracted"
            elif [ "$extracted" != "$FLUTTER_TREE_SHA256" ]; then
              echo "::error::the verified archive extracts to tree digest $extracted, but ci.yml pins $FLUTTER_TREE_SHA256"
              exit 1
            elif [ "$CACHE_HIT" != true ]; then
              save=true
            fi
          fi
          echo "save=$save" >> "$GITHUB_OUTPUT"
      # Saved before the first `flutter` call, which writes into the SDK (tool snapshot, caches).
      - name: Save Flutter SDK
        if: >-
          github.event_name == 'push' &&
          steps.flutter-install.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter
          key: ci-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}
      # actions/cache only warns when a save fails; a lookup proves the entry exists.
      - name: Check Flutter SDK was saved
        if: >-
          github.event_name == 'push' &&
          steps.flutter-install.outputs.save == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter
          key: ci-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Set up Flutter
        working-directory: ${{ runner.temp }}
        run: |
          echo "SHIFA_FLUTTER_ROOT=${RUNNER_TEMP}/flutter" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/flutter/bin/flutter" --disable-analytics
          installed="$("${RUNNER_TEMP}/flutter/bin/flutter" --version --machine | jq -r .frameworkVersion)"
          if [ "$installed" != "$FLUTTER_VERSION" ]; then
            echo "::error::the Flutter SDK reports $installed, expected $FLUTTER_VERSION"
            exit 1
          fi
          "${RUNNER_TEMP}/flutter/bin/flutter" --version
      # pub checks a package's sha256 against pubspec.lock when it downloads it, not when it
      # reuses an unpacked copy from the cache. The cache is filled by a plain
      # `pub get --enforce-lockfile` on main (downloads verified) and saved before anything else
      # runs. Accepted risk (OD-30): code already running on main could pre-create the entry
      # for a lockfile that is not merged yet; such an entry lives only until the lockfile changes.
      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ci-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: Fetch pub packages
        if: steps.pub-cache.outputs.cache-hit != 'true'
        run: '"${SHIFA_FLUTTER_ROOT}/bin/flutter" pub get --enforce-lockfile'
      - name: Save pub cache
        if: >-
          github.event_name == 'push' &&
          steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ci-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: Check pub cache was saved
        if: >-
          github.event_name == 'push' &&
          steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ci-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          lookup-only: true
          fail-on-cache-miss: true

  checks:
    name: verify checks
    needs: [scope, caches]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' &&
      (needs.caches.result == 'success' || (github.event_name != 'push' && needs.caches.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No `cache: pnpm`: setup-node saves the store after the job, once dependencies and tests
      # have run, which breaks the cache rule (see the caches job); a clean install takes about 2 s.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Lockfile must match; minimumReleaseAge in pnpm-workspace.yaml refuses packages younger than 24 h.
      - run: pnpm install --frozen-lockfile
      - name: verify docs
        run: node scripts/verify.mjs docs
      - name: Show verify logs
        if: failure()
        run: if [ -d .verify/logs ]; then tail -n 200 .verify/logs/*.log; fi

  node:
    name: verify node packages
    needs: [scope, caches]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.mode == 'full' &&
      (needs.caches.result == 'success' || (github.event_name != 'push' && needs.caches.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No `cache: pnpm`: setup-node saves the store after the job, once dependencies and tests
      # have run, which breaks the cache rule (see the caches job); a clean install takes about 2 s.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Lockfile must match; minimumReleaseAge in pnpm-workspace.yaml refuses packages younger than 24 h.
      - run: pnpm install --frozen-lockfile
      # DB tests (packages/db) start PostgreSQL, PgBouncer and Ryuk through Testcontainers. Pull
      # them by the digests pinned in packages/db/test-harness/image.ts, so the pull is outside
      # test timeouts.
      - name: Pull database test images
        run: |
          images="$(grep -oE "'(postgres|edoburu/pgbouncer|testcontainers/ryuk):[^']+@sha256:[0-9a-f]{64}'" \
            packages/db/test-harness/image.ts | tr -d "'")"
          if [ "$(echo "$images" | wc -w)" -ne 3 ]; then
            echo "::error::expected 3 digest-pinned images in packages/db/test-harness/image.ts"
            exit 1
          fi
          for image in $images; do docker pull --quiet "$image"; done
      - name: verify full --part node
        run: node scripts/verify.mjs full --part node
      - name: Show verify logs
        if: failure()
        run: if [ -d .verify/logs ]; then tail -n 200 .verify/logs/*.log; fi

  build:
    name: verify build and boot
    needs: [scope, caches]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.mode == 'full' &&
      (needs.caches.result == 'success' || (github.event_name != 'push' && needs.caches.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No `cache: pnpm`: setup-node saves the store after the job, once dependencies and tests
      # have run, which breaks the cache rule (see the caches job); a clean install takes about 2 s.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Lockfile must match; minimumReleaseAge in pnpm-workspace.yaml refuses packages younger than 24 h.
      - run: pnpm install --frozen-lockfile
      # DB tests (packages/db) start PostgreSQL, PgBouncer and Ryuk through Testcontainers. Pull
      # them by the digests pinned in packages/db/test-harness/image.ts, so the pull is outside
      # test timeouts.
      - name: Pull database test images
        run: |
          images="$(grep -oE "'(postgres|edoburu/pgbouncer|testcontainers/ryuk):[^']+@sha256:[0-9a-f]{64}'" \
            packages/db/test-harness/image.ts | tr -d "'")"
          if [ "$(echo "$images" | wc -w)" -ne 3 ]; then
            echo "::error::expected 3 digest-pinned images in packages/db/test-harness/image.ts"
            exit 1
          fi
          for image in $images; do docker pull --quiet "$image"; done
      - name: verify full --part build
        run: node scripts/verify.mjs full --part build
      - name: Show verify logs
        if: failure()
        run: if [ -d .verify/logs ]; then tail -n 200 .verify/logs/*.log; fi

  dart:
    name: verify dart
    needs: [scope, caches]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.mode == 'full' &&
      (needs.caches.result == 'success' || (github.event_name != 'push' && needs.caches.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restore only: the `caches` job saves on pushes to main (OD-30).
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/flutter
          key: ci-flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}
      # Flutter from Google's release storage, checksum-verified, no third-party action. The
      # version must match .fvmrc; the SHA-256 comes from Google's releases_linux.json for it.
      # The cache holds the untouched extraction, and FLUTTER_TREE_SHA256 pins a digest of that
      # tree (paths, types, modes, link targets, file contents). A restored tree that does not
      # match is discarded and reinstalled from the archive, so a planted entry costs time, never
      # integrity. On a version bump, set FLUTTER_TREE_SHA256 to the digest a run prints.
      - name: Install Flutter
        id: flutter-install
        working-directory: ${{ runner.temp }}
        env:
          CACHE_HIT: ${{ steps.flutter-cache.outputs.cache-hit }}
          FVMRC: ${{ github.workspace }}/.fvmrc
        run: |
          # System tools only: a restored cache entry could place look-alikes (sha256sum, find,
          # tar) in a directory that comes earlier on the runner's PATH (OD-35).
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          tree_digest() {
            ( cd "$1" && {
              find . -printf '%y %m %p -> %l\n' | LC_ALL=C sort
              find . -type f -print0 | xargs -0 -r -P4 -n256 sha256sum | LC_ALL=C sort -k2
            } | sha256sum | cut -d' ' -f1 )
          }
          # Only known keys: FVM honours flutterUrl/cachePath in .fvmrc, which could point
          # every developer's `fvm install` at another repository.
          jq -e 'keys - ["flutter","updateGitIgnore","updateVscodeSettings"] == []' "$FVMRC" > /dev/null \
            || { echo "::error::.fvmrc has keys other than flutter/updateGitIgnore/updateVscodeSettings"; exit 1; }
          pinned="$(jq -r .flutter "$FVMRC")"
          if [ "$pinned" != "$FLUTTER_VERSION" ]; then
            echo "::error::.fvmrc pins Flutter $pinned but CI installs $FLUTTER_VERSION; update ci.yml"
            exit 1
          fi
          sdk="${RUNNER_TEMP}/flutter"
          save=false
          # Checked whenever anything is at the path: a restore that failed half-way reports
          # no cache hit but leaves its files behind.
          if [ -e "$sdk" ]; then
            restored="$(tree_digest "$sdk")"
            if [ -n "$FLUTTER_TREE_SHA256" ] && [ "$restored" = "$FLUTTER_TREE_SHA256" ]; then
              echo "Restored Flutter SDK matches the pinned tree digest"
            else
              echo "::warning::restored Flutter SDK does not match FLUTTER_TREE_SHA256 ($restored); reinstalling from the archive"
              rm -rf "$sdk"
            fi
          fi
          if [ ! -d "$sdk" ]; then
            archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            curl -fsSL -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
            echo "${FLUTTER_SHA256}  ${archive}" | sha256sum --check --strict
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            rm "$archive"
            extracted="$(tree_digest "$sdk")"
            echo "Flutter SDK tree digest: $extracted"
            if [ -z "$FLUTTER_TREE_SHA256" ]; then
              echo "::warning::FLUTTER_TREE_SHA256 is not set; the SDK is not cached. Pin: $extracted"
            elif [ "$extracted" != "$FLUTTER_TREE_SHA256" ]; then
              echo "::error::the verified archive extracts to tree digest $extracted, but ci.yml pins $FLUTTER_TREE_SHA256"
              exit 1
            elif [ "$CACHE_HIT" != true ]; then
              save=true
            fi
          fi
          echo "save=$save" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter
        working-directory: ${{ runner.temp }}
        run: |
          echo "SHIFA_FLUTTER_ROOT=${RUNNER_TEMP}/flutter" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/flutter/bin/flutter" --disable-analytics
          installed="$("${RUNNER_TEMP}/flutter/bin/flutter" --version --machine | jq -r .frameworkVersion)"
          if [ "$installed" != "$FLUTTER_VERSION" ]; then
            echo "::error::the Flutter SDK reports $installed, expected $FLUTTER_VERSION"
            exit 1
          fi
          "${RUNNER_TEMP}/flutter/bin/flutter" --version
      # pub checks a package's sha256 against pubspec.lock when it downloads it, not when it
      # reuses an unpacked copy from the cache. The cache is filled by a plain
      # `pub get --enforce-lockfile` on main (downloads verified) and saved before anything else
      # runs. Accepted risk (OD-30): code already running on main could pre-create the entry
      # for a lockfile that is not merged yet; such an entry lives only until the lockfile changes.
      - name: Restore pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ci-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - name: Fetch pub packages
        if: steps.pub-cache.outputs.cache-hit != 'true'
        run: '"${SHIFA_FLUTTER_ROOT}/bin/flutter" pub get --enforce-lockfile'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No `cache: pnpm`: setup-node saves the store after the job, once dependencies and tests
      # have run, which breaks the cache rule (see the caches job); a clean install takes about 2 s.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Lockfile must match; minimumReleaseAge in pnpm-workspace.yaml refuses packages younger than 24 h.
      - run: pnpm install --frozen-lockfile
      # The drift cache (scripts/lib/drift-cache.mjs) is off here because CI is set: a marker
      # only claims "this exact tree was clean" and cannot be re-checked without regenerating,
      # so it is never restored from an actions/cache entry; CI always regenerates the clients.
      - name: verify full --part dart
        run: node scripts/verify.mjs full --part dart
      # verify must never re-resolve Dart dependencies; a changed lockfile means it did.
      - name: pubspec.lock unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Show verify logs
        if: failure()
        run: if [ -d .verify/logs ]; then tail -n 200 .verify/logs/*.log; fi

  # The required check on main keeps its name. It passes only when every part passed, or, for a
  # docs-only pull request (mode docs), when `checks` passed and the other parts were skipped.
  # A cancelled, failed or wrongly skipped part fails it.
  verify:
    name: verify (full)
    needs: [scope, caches, checks, node, build, dart]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every verify part passed
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ needs.scope.outputs.mode }}
          SCOPE: ${{ needs.scope.result }}
          CACHES: ${{ needs.caches.result }}
          CHECKS: ${{ needs.checks.result }}
          NODE: ${{ needs.node.result }}
          BUILD: ${{ needs.build.result }}
          DART: ${{ needs.dart.result }}
        run: |
          echo "event=$EVENT mode=$MODE scope=$SCOPE caches=$CACHES checks=$CHECKS node=$NODE build=$BUILD dart=$DART"
          if [ "$SCOPE" != success ] || [ "$CHECKS" != success ]; then
            echo "::error::verify scope or checks did not succeed"
            exit 1
          fi
          # Pushes to main save the caches before any code runs (OD-30); pull requests skip it.
          if [ "$EVENT" = push ]; then want_caches=success; else want_caches=skipped; fi
          if [ "$CACHES" != "$want_caches" ]; then
            echo "::error::the caches job ended '$CACHES', expected '$want_caches' on $EVENT"
            exit 1
          fi
          case "$MODE" in
            full) want=success ;;
            docs) want=skipped ;;
            *) echo "::error::unknown verify mode"; exit 1 ;;
          esac
          for result in "$NODE" "$BUILD" "$DART"; do
            if [ "$result" != "$want" ]; then
              echo "::error::a verify part ended '$result', expected '$want' in $MODE mode"
              exit 1
            fi
          done

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # High and critical advisories fail the build; lower ones are listed for the weekly review.
      - run: pnpm audit --audit-level high

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks is run directly (checksum-verified) because gitleaks-action v3 scans at most
      # 30 commits of a pull request.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="$PUSH_AFTER"   # first push: whole history reachable from it
          fi
          echo "Scanning ${range}"
          # --verbose names commit, file, line and rule of each finding; --redact hides the value.
          # Reviewed false positives go in .gitleaksignore (fingerprints), never a wider allowlist.
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --no-banner --redact --verbose --exit-code 1 --log-opts="${range}" .

  workflows:
    name: workflow lint (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  pr-size:
    name: PR size budget
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check size
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-pr-size.mjs "origin/${BASE_REF}"
