# Quality gates for every pull request and every push to main.
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment); Dependabot updates them.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel runs on main: every merged commit must get a completed verify and secret scan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (full)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Lockfile must match; minimumReleaseAge in pnpm-workspace.yaml refuses packages younger than 24 h.
      - run: pnpm install --frozen-lockfile
      # Flutter from Google's release storage, checksum-verified, no third-party action. The
      # version must match .fvmrc; the SHA-256 comes from Google's releases_linux.json for it.
      - name: Install Flutter 3.47.9
        env:
          FLUTTER_VERSION: 3.47.9
          FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
        run: |
          # Only known keys: FVM honours flutterUrl/cachePath in .fvmrc, which could point
          # every developer's `fvm install` at another repository.
          jq -e 'keys - ["flutter","updateGitIgnore","updateVscodeSettings"] == []' .fvmrc > /dev/null \
            || { echo "::error::.fvmrc has keys other than flutter/updateGitIgnore/updateVscodeSettings"; exit 1; }
          pinned="$(jq -r .flutter .fvmrc)"
          if [ "$pinned" != "$FLUTTER_VERSION" ]; then
            echo "::error::.fvmrc pins Flutter $pinned but CI installs $FLUTTER_VERSION; update ci.yml"
            exit 1
          fi
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
          echo "${FLUTTER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          echo "SHIFA_FLUTTER_ROOT=${RUNNER_TEMP}/flutter" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/flutter/bin/flutter" --disable-analytics
          "${RUNNER_TEMP}/flutter/bin/flutter" --version
      - run: node scripts/verify.mjs full
      # verify must never re-resolve Dart dependencies; a changed lockfile means it did.
      - name: pubspec.lock unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Show verify logs
        if: failure()
        run: if [ -d .verify/logs ]; then tail -n 200 .verify/logs/*.log; fi

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # High and critical advisories fail the build; lower ones are listed for the weekly review.
      - run: pnpm audit --audit-level high

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks is run directly (checksum-verified) because gitleaks-action v3 scans at most
      # 30 commits of a pull request.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="$PUSH_AFTER"   # first push: whole history reachable from it
          fi
          echo "Scanning ${range}"
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="${range}" .

  workflows:
    name: workflow lint (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  pr-size:
    name: PR size budget
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check size
        env:
          BASE_REF: ${{ github.base_ref }}
          SIZE_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'size/override') }}
        run: node scripts/check-pr-size.mjs "origin/${BASE_REF}"
