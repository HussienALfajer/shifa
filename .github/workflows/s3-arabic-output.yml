# Spike 0.3-S3: Arabic output (Gotenberg PDFs, thermal raster, browser-print parity) and Arabic
# name search (normaliser vectors in TypeScript and Dart, PostgreSQL 18 search). Manual dispatch
# only; never part of PR CI (OD-31). Uploads `.verify/s3/` (diffs, candidates, bench JSON;
# counts and timings only, no rendered content beyond the synthetic goldens' candidates).
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
name: s3-arabic-output

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: s3-arabic-output
  cancel-in-progress: false

# Flutter pins: the same values as ci.yml (the install step checks them against .fvmrc).
env:
  FLUTTER_VERSION: 3.47.9
  FLUTTER_SHA256: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a

jobs:
  output:
    name: PDF, thermal and browser-print tests + render bench
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright (browser-print parity)
        working-directory: spikes/s3-arabic-output/output
        run: pnpm exec playwright install --with-deps chromium
      - name: Output tests (Gotenberg, poppler, goldens, thermal, parity)
        working-directory: spikes/s3-arabic-output/output
        run: pnpm run test:spike
      - name: Render bench
        if: always()
        working-directory: spikes/s3-arabic-output/output
        run: pnpm run bench:render
      - name: Upload .verify/s3
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3-output
          path: .verify/s3
          retention-days: 30

  search:
    name: normaliser vectors (TS, Dart) + PostgreSQL search + search bench
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dart comes with the pinned Flutter SDK, checksum-verified (OD-35), as in s1-offline.yml.
      - name: Install Flutter (Dart SDK)
        working-directory: ${{ runner.temp }}
        env:
          FVMRC: ${{ github.workspace }}/.fvmrc
        run: |
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          pinned="$(jq -r .flutter "$FVMRC")"
          if [ "$pinned" != "$FLUTTER_VERSION" ]; then
            echo "::error::.fvmrc pins Flutter $pinned but s3-arabic-output.yml installs $FLUTTER_VERSION"
            exit 1
          fi
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL -o "$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${archive}"
          echo "${FLUTTER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          echo "SHIFA_FLUTTER_ROOT=${RUNNER_TEMP}/flutter" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/flutter/bin/flutter" --disable-analytics
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Normaliser and PostgreSQL search tests
        working-directory: spikes/s3-arabic-output/search
        run: pnpm run test:spike
      # The Dart port is outside the pub workspace, so verify does not run it.
      - name: Dart port (vectors, idempotence, analyze)
        working-directory: spikes/s3-arabic-output/normaliser_dart
        run: |
          node ../../../scripts/dart.mjs dart pub get --enforce-lockfile
          node ../../../scripts/dart.mjs dart analyze --fatal-infos
          node ../../../scripts/dart.mjs dart test
      - name: Search bench
        if: always()
        working-directory: spikes/s3-arabic-output/search
        run: pnpm run bench:search
      - name: Upload .verify/s3
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s3-search
          path: .verify/s3
          retention-days: 30
