name: api_client_dart
description: Dart API client generated from packages/contracts/generated/openapi.json (ADR-0013).
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dio: 5.11.1
  json_annotation: 4.12.0
  retrofit: 4.10.0

dev_dependencies:
  build_runner: 2.17.1
  json_serializable: 6.15.2
  retrofit_generator: 10.3.3
  # Pure Dart OpenAPI generator (no Java). 2.x is newer than the 24-hour rule allows today.
  swagger_parser: 1.46.0
  # 1.32.0: the newest test on Flutter 3.50.1's test_api 0.7.14 (flutter_test shares the
  # workspace resolution); raise it with the Flutter pin (.claude/rules/dart.md).
  test: 1.32.0
  very_good_analysis: ^11.0.0
