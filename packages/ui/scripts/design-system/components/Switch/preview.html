<!-- @dsCard group="Forms" height=300 subtitle="Off, on, disabled, a description · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var SWITCHES = [
    { children: 'تذكير عبر واتساب' },
    { children: 'تذكير عبر واتساب', defaultChecked: true },
    { children: 'تذكير بالبريد', disabled: true },
    { children: 'قبول الحجز من صفحة العيادة', defaultChecked: true, description: 'يظهر للمرضى زر «احجز»' }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    SWITCHES.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Switch', props);
    });
  });
</script>
</body>
</html>
