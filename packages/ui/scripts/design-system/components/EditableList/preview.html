<!-- @dsCard group="Forms" height=820 subtitle="Choices with their use, one archived; read only · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 16px; padding: 16px; }
  .panel { display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-surface); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"><div class="a"></div><div class="b"></div></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"><div class="a"></div></section>
</div>
<script>
  var items = [
    { id: 'a', label: 'طبيب آخر', use: 'في 41 ملفًا' }, { id: 'b', label: 'صيدلية', use: 'في 12 ملفًا' },
    { id: 'c', label: 'الأهل والمعارف', use: 'في 96 ملفًا' }, { id: 'd', label: 'جريدة', use: 'في ملفين', archived: true }
  ];
  var ar = document.querySelector('[lang="ar"]');
  window.Shifa.mount(ar.querySelector('.a'), 'EditableList', { label: 'خيارات «جهة الإحالة»', items: items, max: 250 });
  window.Shifa.mount(ar.querySelector('.b'), 'EditableList', { label: 'خيارات «شركة التأمين»', items: items.slice(0, 2), max: 250, readOnly: true });
  window.Shifa.mount(document.querySelector('[lang="en"] .a'), 'EditableList', {
    label: 'Referral source choices', max: 250,
    items: [{ id: 'a', label: 'Another doctor', use: 'on 41 charts' }, { id: 'b', label: 'Pharmacy', use: 'on 12 charts' }, { id: 'c', label: 'Newspaper', use: 'on 2 charts', archived: true }]
  });
</script>
</body>
</html>
