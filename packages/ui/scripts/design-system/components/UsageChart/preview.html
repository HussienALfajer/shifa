<!-- @dsCard group="Data display" height=760 subtitle="30 days of sign-ins, average and today · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-direction: column; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-surface); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var COUNTS = [6, 9, 11, 0, 0, 12, 14, 10, 13, 8, 0, 7, 15, 16, 12, 11, 9, 0, 13, 18, 21, 17, 14, 0, 0, 12, 15, 19, 16, 14];
  var END = Date.UTC(2026, 10, 26);
  var DAYS = COUNTS.map(function (count, i) {
    return { date: new Date(END - (COUNTS.length - 1 - i) * 86400000).toISOString().slice(0, 10), count: count };
  });
  document.querySelectorAll('.panel').forEach(function (panel) {
    var slot = document.createElement('div');
    panel.appendChild(slot);
    var rtl = panel.getAttribute('dir') === 'rtl';
    window.Shifa.mount(slot, 'UsageChart', {
      'aria-label': rtl ? 'آخر 30 يومًا' : 'Last 30 days',
      days: DAYS,
      unit: rtl ? '{n} تسجيل دخول' : '{n} sign-ins'
    });
  });
</script>
</body>
</html>
