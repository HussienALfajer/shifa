<!-- @dsCard group="Forms" height=360 subtitle="Unchecked, checked, some, an error, disabled, a description · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var BOXES = [
    { children: 'مريض جديد' },
    { children: 'مريض جديد', defaultChecked: true },
    { children: 'تحديد الكل', defaultChecked: 'indeterminate' },
    { children: 'أوافق على شروط الحجز', error: 'الموافقة مطلوبة للحجز' },
    { children: 'مريض جديد', defaultChecked: true, disabled: true },
    { children: 'مريض لديه حساسية دوائية', defaultChecked: true, description: 'تظهر علامة تحذير في ملفه' }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    BOXES.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Checkbox', props);
    });
  });
</script>
</body>
</html>
