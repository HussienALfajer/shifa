<!-- @dsCard group="Feedback" height=260 subtitle="Three sizes, a panel wait · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; align-items: center; gap: 24px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-brand-primary); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var SPINNERS = [
    { size: 'sm', delay: 0 },
    { size: 'md', delay: 0 },
    { size: 'lg', delay: 0 },
    { size: 'lg', delay: 0, showLabel: true }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    SPINNERS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Spinner', props);
    });
  });
</script>
</body>
</html>
