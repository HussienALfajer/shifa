<!-- @dsCard group="Navigation" height=300 subtitle="Three options, four with counts, a disabled option · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var CONTROLS = [
    { 'aria-label': 'عرض التقويم', defaultValue: 'day', items: [
      { value: 'day', label: 'اليوم' }, { value: 'week', label: 'الأسبوع' }, { value: 'month', label: 'الشهر' }
    ] },
    { 'aria-label': 'حالة الزيارة', defaultValue: 'waiting', items: [
      { value: 'all', label: 'الكل', count: 18 }, { value: 'waiting', label: 'بالانتظار', count: 5 },
      { value: 'room', label: 'في الغرفة', count: 1 }, { value: 'done', label: 'انتهت', count: 12 }
    ] },
    { 'aria-label': 'طريقة العرض', defaultValue: 'list', items: [
      { value: 'list', label: 'قائمة', icon: 'list' }, { value: 'cards', label: 'بطاقات', icon: 'users' },
      { value: 'map', label: 'خريطة', disabled: true }
    ] }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    CONTROLS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'SegmentedControl', props);
    });
  });
</script>
</body>
</html>
