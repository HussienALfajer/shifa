<!-- @dsCard group="Actions" height=200 subtitle="Secondary, ghost, primary, danger, disabled, sm · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var BUTTONS = [
    { icon: 'pencil', label: 'تعديل' },
    { icon: 'x', label: 'إغلاق', variant: 'ghost' },
    { icon: 'plus', label: 'إضافة موعد', variant: 'primary' },
    { icon: 'trash', label: 'حذف المرفق', variant: 'danger' },
    { icon: 'pencil', label: 'تعديل', disabled: true },
    { icon: 'x', label: 'مسح', size: 'sm', variant: 'ghost' }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    BUTTONS.forEach(function (props) {
      var slot = document.createElement('span');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'IconButton', props);
    });
  });
</script>
</body>
</html>
