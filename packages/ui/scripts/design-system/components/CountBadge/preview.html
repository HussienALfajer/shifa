<!-- @dsCard group="Data display" height=200 subtitle="Counts, the cap and a dot · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var COUNTS = [
    { tone: 'brand', count: 5, label: '5 بالانتظار' },
    { tone: 'danger', count: 12, label: '12 رسالة غير مقروءة' },
    { count: 140, label: '140 زيارة' },
    { dot: true, tone: 'danger', label: 'إشعارات جديدة' }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    COUNTS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'CountBadge', props);
    });
  });
</script>
</body>
</html>
