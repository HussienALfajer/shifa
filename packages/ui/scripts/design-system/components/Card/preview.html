<!-- @dsCard group="Data display" height=420 subtitle="A full card and a link card · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var CARDS = [
    {
      title: 'موعد اليوم',
      description: 'الأحد 22/11/2026 · 10:30',
      body: ['المريض: مريض تجريبي', 'الطبيب: طبيب تجريبي'],
      footer: [{ label: 'سجّل الوصول', variant: 'primary' }, { label: 'تأجيل' }]
    },
    {
      title: 'ملف مريض تجريبي',
      description: 'ملف رقم P-10482',
      href: '#patient',
      body: ['رصيد مستحق 45,000 ل.س']
    }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    CARDS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Card', props);
    });
  });
</script>
</body>
</html>
