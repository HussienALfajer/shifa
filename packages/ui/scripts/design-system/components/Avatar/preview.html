<!-- @dsCard group="Data display" height=260 subtitle="Sizes, initials and a group · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-surface); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var AVATARS = [
    { name: 'سلمى تجريبية', size: 'xs' },
    { name: 'عمر الاختبار', size: 'sm' },
    { name: 'ليلى نموذج', size: 'md' },
    { name: 'يوسف عيّنة', size: 'lg' },
    { name: 'Rami Sample', size: 'xl' },
    { label: 'الأطباء المناوبون', max: 3, people: [
      { name: 'سلمى تجريبية' }, { name: 'عمر الاختبار' }, { name: 'ليلى نموذج' },
      { name: 'يوسف عيّنة' }, { name: 'نور مثال' }
    ] }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    AVATARS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Avatar', props);
    });
  });
</script>
</body>
</html>
