<!-- @dsCard group="Actions" height=200 subtitle="Two groups, a pressed toggle, a disabled button · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-direction: column; align-items: flex-start; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var PROPS = {
    'aria-label': 'أدوات قائمة المرضى',
    groups: [
      [{ label: 'طباعة', icon: 'printer' }, { label: 'تصدير', icon: 'file-text' }],
      [{ label: 'الأحدث أولاً', pressed: true }, { label: 'دمج', disabled: true }, { label: 'الأعمدة', icon: 'list' }]
    ]
  };
  document.querySelectorAll('.panel').forEach(function (panel) {
    var slot = document.createElement('div');
    panel.appendChild(slot);
    window.Shifa.mount(slot, 'Toolbar', PROPS);
  });
</script>
</body>
</html>
