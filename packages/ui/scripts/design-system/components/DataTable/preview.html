<!-- @dsCard group="Data display" height=760 subtitle="A patient list, sorted, two rows selected · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-direction: column; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var PROPS = {
    'aria-label': 'قائمة المرضى',
    selectable: true,
    defaultSelected: ['1', '3'],
    defaultSort: { columnId: 'visit', direction: 'descending' },
    columns: [
      { id: 'name', header: 'الاسم', sortable: true },
      { id: 'file', header: 'رقم الملف', kind: 'latin' },
      { id: 'visit', header: 'آخر زيارة', sortable: true },
      { id: 'balance', header: 'الرصيد (ل.س)', kind: 'number', sortable: true }
    ],
    rows: [
      { name: 'مريضة تجريبية', file: 'P-10482', visit: '22/11/2026', balance: 0 },
      { name: 'مريض الاختبار', file: 'P-10517', visit: '22/11/2026', balance: 45000 },
      { name: 'مريضة نموذج', file: 'P-09876', visit: '21/11/2026', balance: 0 },
      { name: 'مريض عيّنة', file: 'P-10231', visit: '20/11/2026', balance: 120000 },
      { name: 'مريضة مثال', file: 'P-10602', visit: '18/11/2026', balance: 0 }
    ]
  };
  document.querySelectorAll('.panel').forEach(function (panel, i) {
    var slot = document.createElement('div');
    panel.appendChild(slot);
    var props = Object.assign({}, PROPS, { 'aria-label': PROPS['aria-label'] + ' ' + (i + 1) });
    window.Shifa.mount(slot, 'DataTable', props);
  });
</script>
</body>
</html>
