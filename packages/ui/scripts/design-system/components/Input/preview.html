<!-- @dsCard group="Forms" height=590subtitle="Placeholder, filled, error, disabled, read-only, search icon · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var FIELDS = [
    { label: 'اسم المريض', placeholder: 'مثال: سارة الأحمد' },
    { label: 'اسم المريض', defaultValue: 'سارة الأحمد' },
    { label: 'اسم المريض', required: true, error: 'اكتب اسم المريض' },
    { label: 'اسم المريض', defaultValue: 'سارة الأحمد', disabled: true },
    { label: 'رقم الملف', defaultValue: '1042', readOnly: true },
    { label: 'بحث', startIcon: 'magnifying-glass', placeholder: 'اسم أو رقم هاتف', hint: 'يكفي جزء من الاسم' }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    FIELDS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Input', props);
    });
  });
</script>
</body>
</html>
