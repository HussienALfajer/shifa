<!-- @dsCard group="Forms" height=300 subtitle="Empty, 24-hour, an error, disabled, 12-hour · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var TIMES = [
    { label: 'وقت الموعد' },
    { label: 'وقت الموعد', defaultValue: '14:30', hint: 'دوام العيادة 09:00 – 17:00' },
    { label: 'وقت الموعد', defaultValue: '19:15', error: 'اختر وقتاً بين 09:00 و17:00' },
    { label: 'وقت الموعد', defaultValue: '14:30', disabled: true },
    { label: 'وقت الموعد', defaultValue: '14:30', hourCycle: 12 }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    TIMES.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'TimeInput', props);
    });
  });
</script>
</body>
</html>
