<!-- @dsCard group="Navigation" height=200 subtitle="Press Search, then type «احمد» to see an alef form found and marked · RTL light" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .label { margin: 0; font-size: 12px; color: var(--shifa-color-text-muted); }
</style>
</head>
<body>
<div class="board" data-theme="light" dir="rtl" lang="ar">
  <p class="label">اضغط «بحث» ثم اكتب «احمد» · الأسهم تنقل · Enter يفتح · Esc يغلق</p>
  <div data-slot="palette"></div>
</div>
<script>
  window.Shifa.mount(document.querySelector('[data-slot="palette"]'), 'CommandPalette', {
    triggerLabel: 'بحث',
    title: 'بحث وأوامر',
    inputLabel: 'ابحث عن مريض أو إجراء',
    emptyText: 'لا نتائج لـ «{query}»',
    groups: [
      { label: 'المرضى', items: [
        { value: 'p1', label: 'أحمد خليل', description: 'ملف 1187', icon: 'user' },
        { value: 'p2', label: 'سارة الأحمد', description: 'ملف 1042', icon: 'user' },
        { value: 'p3', label: 'ليلى حداد', description: 'ملف 0412', icon: 'user' }
      ] },
      { label: 'إجراءات', items: [
        { value: 'a1', label: 'موعد جديد', icon: 'calendar-plus' },
        { value: 'a2', label: 'تسجيل مريض جديد', icon: 'plus' }
      ] }
    ]
  });
</script>
</body>
</html>
