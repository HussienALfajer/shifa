<!-- @dsCard group="Forms" height=470subtitle="Placeholder, chosen, invalid, disabled · RTL light comfortable, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  // Names from the synthetic generator of packages/testing (test/fixtures.ts), never real ones.
  var ITEMS = [
    { value: '1001', label: 'د. سعاد الحمصي' },
    { value: '1002', label: 'د. حسين طرابيشي' },
    { value: '1003', label: 'د. مريم المصري' },
    { value: '1004', label: 'د. نادية الحلبي', disabled: true, hint: 'في إجازة' }
  ];
  var FIELDS = [
    { label: 'الطبيب', items: ITEMS, placeholder: 'اختر الطبيب' },
    { label: 'الطبيب المعالج', items: ITEMS, defaultValue: '1001' },
    { label: 'نوع الزيارة', items: ITEMS, placeholder: 'اختر النوع', error: 'اختر نوع الزيارة قبل الحفظ' },
    { label: 'الفرع', items: ITEMS, defaultValue: '1002', disabled: true }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    FIELDS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Select', props);
    });
  });
</script>
</body>
</html>
