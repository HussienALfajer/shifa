<!-- @dsCard group="Forms" height=330 subtitle="Empty, filled, an error, disabled · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var CODES = [
    { label: 'رمز التحقق', hint: 'أرسلناه برسالة إلى 0944 123 456' },
    { label: 'رمز التحقق', defaultValue: '482071' },
    { label: 'رمز التحقق', defaultValue: '482075', error: 'الرمز غير صحيح. بقيت محاولتان' },
    { label: 'رمز التحقق', defaultValue: '482071', disabled: true }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    CODES.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'OtpInput', props);
    });
  });
</script>
</body>
</html>
