<!-- @dsCard group="Feedback" height=360 subtitle="A person's card and a picture loading · RTL light, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .panel { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-surface); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"></section>
</div>
<script>
  var SKELETONS = [
    { label: 'جارٍ تحميل بطاقة المريض', avatar: true, lines: 3 },
    { label: 'جارٍ تحميل الصورة', block: true, lines: 1 }
  ];
  document.querySelectorAll('.panel').forEach(function (panel) {
    SKELETONS.forEach(function (props) {
      var slot = document.createElement('div');
      panel.appendChild(slot);
      window.Shifa.mount(slot, 'Skeleton', props);
    });
  });
</script>
</body>
</html>
