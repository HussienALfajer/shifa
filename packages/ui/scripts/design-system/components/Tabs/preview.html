<!-- @dsCard group="Navigation" height=300 subtitle="Selected, at rest, disabled · RTL light comfortable, LTR dark compact" -->
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
  .board { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .panel { padding: 16px; border-radius: 12px; border: 1px solid var(--shifa-color-border-default); background: var(--shifa-color-bg-app); color: var(--shifa-color-text-default); }
</style>
</head>
<body>
<div class="board">
  <section class="panel" data-theme="light" dir="rtl" lang="ar"><div data-slot></div></section>
  <section class="panel" data-theme="dark" data-density="compact" dir="ltr" lang="en"><div data-slot></div></section>
</div>
<script>
  var PROPS = {
    'aria-label': 'ملف المريض',
    defaultValue: 'summary',
    items: [
      { value: 'summary', label: 'الملخص', panel: 'آخر زيارة: 12/11/2026 · فحص دوري' },
      { value: 'visits', label: 'الزيارات', panel: 'ثلاث زيارات هذا العام' },
      { value: 'prescriptions', label: 'الوصفات', panel: 'وصفة واحدة سارية' },
      { value: 'files', label: 'المرفقات', disabled: true }
    ]
  };
  document.querySelectorAll('[data-slot]').forEach(function (slot) {
    window.Shifa.mount(slot, 'Tabs', PROPS);
  });
</script>
</body>
</html>
